<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — BookDucks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="themes.css" />
</head>
<body class="auth-page">

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="home.html" class="nav-logo">
      <img src="logo.png" alt="BookDucks" height="44" />
    </a>
  </nav>

  <!-- AUTH CARD -->
  <main class="auth-container">
    <div class="auth-card">

      <!-- TABS: Login / Register -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- ERROR MESSAGE -->
      <div id="auth-error" class="error-msg" style="display:none"></div>

      <!-- LOGIN FORM -->
      <div id="form-login">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" />
        </div>
        <button class="btn-primary btn-full" onclick="handleLogin()">Login</button>
      </div>

      <!-- REGISTER FORM -->
      <div id="form-register" style="display:none">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="ducklover99" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="••••••••" />
        </div>
        <button class="btn-primary btn-full" onclick="handleRegister()">Create Account</button>
      </div>

    </div>
  </main>

  <script src="api.js"></script>
  <script src="auth.js"></script>
</body>
</html>
