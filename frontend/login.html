<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — BookDucks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="themes.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="auth-page">

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="home.html" class="nav-logo">
      <img src="logo.png" alt="BookDucks" height="44" />
    </a>
    <a href="books.html" class="btn-ghost">All Books</a>
  </nav>

  <!-- AUTH CARD -->
  <main class="auth-container">
    <div class="auth-card">
      <!-- TABS -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login"    onclick="switchTab('login')">Login</button>
        <button class="auth-tab"        id="tab-register" onclick="switchTab('register')">Register</button>
      </div>
      <!-- ERROR / SUCCESS MESSAGE -->
      <div id="auth-error" style="display:none; margin-bottom:0.75rem; font-size:0.85rem;"></div>
      <!-- LOGIN FORM -->
      <div id="form-login">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="login-password" placeholder="••••••••" />
            <button class="pw-toggle" id="toggle-login-pw" type="button" aria-label="Show password">SHOW</button>
          </div>
        </div>
        <button class="btn-primary btn-full" id="login-btn" onclick="handleLogin()">Login</button>
      </div>
      <!-- REGISTER FORM -->
      <div id="form-register" style="display:none">
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" placeholder="ducklover99" />
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="reg-password" placeholder="••••••••" />
            <button class="pw-toggle" id="toggle-reg-pw" type="button" aria-label="Show password">SHOW</button>
          </div>
          <!-- RULES -->
          <ul class="pw-rules">
            <li id="rule-length">At least 8 characters</li>
            <li id="rule-upper">At least one capital letter</li>
            <li id="rule-number">At least one number</li>
          </ul>
        </div>

        <button class="btn-primary btn-full" id="register-btn" onclick="handleRegister()">Create Account</button>

      </div>

    </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  
</body>
</html>
