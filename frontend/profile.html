<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile — BookDucks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="themes.css" />
  <link rel="stylesheet" href="profile.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="home.html" class="nav-logo">
        <img src="logo.png" alt="BookDucks" height="44" />
    </a>
    <div class="nav-links">
        <span id="nav-username" class="nav-user"></span>
        <a href="books.html" class="btn-ghost">All Books</a>
        <a href="profile.html" id="nav-profile" class="btn-ghost" style="display:none">My Profile</a>
        <a href="admin.html" id="nav-admin" class="btn-ghost" style="display:none">Admin </a>
        <a href="#" id="nav-logout" class="btn-ghost" style="display:none" onclick="logout()">Logout</a>
        <a href="login.html" id="nav-login" class="btn-primary">Login</a>
    </div>
  </nav>

  <!-- PROFILE HEADER -->
  <section class="profile-header">
      <div class="container profile-header-inner">
          <div class="profile-left">
              <div class="profile-avatar" id="profile-avatar"></div>
          </div>
          <div class="profile-right">
              <p class="profile-greeting">Hi,</p>
              <h1 class="profile-name" id="profile-name">Loading...</h1>
              <p class="profile-tagline" id="profile-tagline"></p>
              <p class="profile-email" id="profile-email"></p>
          </div>
      </div>
  </section>

  <!-- ATT LÄSA LIST -->
  <main class="container">
    <div class="section-header">
      <h2 class="section-title"> My To-Read List </h2>
      <div class="sort-controls">
        <span class="sort-label">Sort by:</span>
        <button class="sort-btn active" onclick="sortList('title', this)">Title (A–Z)</button>
        <button class="sort-btn" onclick="sortList('author', this)">Author (A–Z last names)</button>
      </div>
    </div>

    <div id="reading-list" class="books-grid">
      <!-- injected by profile.js -->
    </div>

    <!-- VG: Rated Books -->
    <div class="section-header" style="margin-top: 3rem">
      <h2 class="section-title">My Rated Books ⭐</h2>
      <div class="sort-controls">
        <span class="sort-label">Sort by:</span>
        <button class="sort-btn active" onclick="sortRated('title', this)">Title (A–Z)</button>
        <button class="sort-btn" onclick="sortRated('author', this)">Author (A–Z last names)</button>
        <button class="sort-btn" onclick="sortRated('rating', this)">Rating (High - Low)</button>
      </div>
    </div>

    <div id="rated-list" class="books-grid">
      <!-- injected by profile.js -->
    </div>
  </main>

  <footer class="footer">
    <p>🦆 BookDucks — Read more, quack more</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="api.js"></script>
  <script src="profile.js"></script>
</body>
</html>
