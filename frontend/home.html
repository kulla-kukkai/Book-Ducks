<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BookDucks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quattrocento+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="themes.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="home.html" class="nav-logo">
      <img src="logo.png" alt="BookDucks"/>
    </a>
    <div class="nav-links">
      <span id="nav-username" class="nav-user"></span>
      <a href="profile.html" id="nav-profile" class="btn-ghost" style="display:none">My Profile</a>
      <a href="#" id="nav-logout" class="btn-ghost" style="display:none">Logout</a>
      <a href="login.html" id="nav-login" class="btn-primary">Login</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <p class="hero-tag">Welcome, fellow duck</p>
      <h1 class="hero-title">What the duck<br/>are you reading?</h1>
      <p class="hero-sub">Find your next obsession — or just quack around</p>
    </div>
  </section>

  <!-- BOOKS SECTION — stripe-bg อยู่ตรงนี้ -->
  <section class="books-section">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title">All Books</h2>
        <span class="section-count" id="book-count"></span>
      </div>
      <div id="books-grid" class="books-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </section>

  <!-- ADMIN PANEL (VG) -->
  <section id="admin-panel" class="admin-panel" style="display:none">
    <div class="container">
      <h2 class="section-title">Admin Panel</h2>
      <p>Upload new books here (VG feature — coming soon)</p>
    </div>
  </section>


  <!-- FOOTER — เป็ดลอยอยู่เหนือ ข้อความอยู่ใน footer ตามปกติ -->
  <footer class="footer">
    <div class="duck-banner">
      <img src="duck-banner.png" alt="BookDucks family" />
    </div>
    <p>BookDucks — Read more, quack more</p>
  </footer>

  <script src="api.js"></script>
  <script src="home.js"></script>
</body>
</html>
