<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BookDucks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,90₀&family=Quattrocento+Sans:ital,wght@₀,4₀₀;₀,7₀₀;₁,4₀₀;₁,7₀₀&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="themes.css" />
</head>
<body>

<!-- NAVBAR -->
    <nav class="navbar">
        <a href="home.html" class="nav-logo">
            <img src="logo.png" alt="BookDucks" height="44" />
        </a>
        <div class="nav-links">
            <a href="books.html" class="btn-ghost">All Books</a>
            <span id="nav-username" class="nav-user"></span>
            <a href="profile.html" id="nav-profile" class="btn-ghost" style="display:none">My Profile</a>
            <a href="admin.html" id="nav-admin" class="btn-ghost" style="display:none">Admin </a>
            <a href="#" id="nav-logout" class="btn-ghost" style="display:none" onclick="logout()">Logout</a>
            <a href="login.html" id="nav-login" class="btn-primary">Login</a>
        </div>
    </nav>

<!-- HERO -->
    <section class="hero">
        <div class="hero-content">
        <p class="hero-tag">Welcome, fellow duck</p>
        <h1 class="hero-title">What the duck<br/>are you reading?</h1>
        <p class="hero-sub">Find your next obsession — or just quack around</p>
        <a href="/frontend/books.html" class="btn-cta">Browse All Books </a>
        </div>
    </section>

<!-- BOOKS SECTION -->
<main class="books-section" id="books">
    <div class="container">
        <div class="section-header">
        <h2 class="section-title">New Arrivals</h2>
        <span class="section-count" id="book-count"></span>
        </div>

        <!-- carousel wrapper -->
        <div class="carousel-wrap">
        <button class="carousel-btn prev" id="btn-prev">‹</button>
        <div class="carousel-track" id="books-grid">
            <!-- cards injected by home.js -->
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
        <button class="carousel-btn next" id="btn-next">›</button>
        </div>

        <!-- dots -->
        <div class="carousel-dots" id="carousel-dots"></div>
    </div>
    </main>


    <!-- FOOTER — เป็ดลอยอยู่เหนือ ข้อความอยู่ใน footer ตามปกติ -->
    <footer class="footer">
        <div class="duck-banner">
        <img src="duck-banner.png" alt="BookDucks family" />
        </div>
        <p>BookDucks — Read more, quack more</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="api.js"></script>
    <script src="home.js"></script>
</body>
</html>
